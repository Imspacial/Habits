<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#f5f6f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Habits">
<title>Habits — трекер привычек</title>
<style>
:root{--bg:#f5f6f1;--grid:#dde4ea;--ink:#1d2740;--mute:#667189;--card:#fff;--line:#cfd8e1;--off:#eaeef2;--acc:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--grid:#1c2230;--ink:#e7ebf5;--mute:#93a0ba;--card:#1a1f2b;--line:#2c3547;--off:#232a39;--acc:#8aa0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--grid:#1c2230;--ink:#e7ebf5;--mute:#93a0ba;--card:#1a1f2b;--line:#2c3547;--off:#232a39;--acc:#8aa0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px;background-color:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px}
.nav{display:flex;align-items:center;gap:8px;margin-top:10px}
.nav .lbl{flex:1;text-align:center;font-weight:650;font-size:18px}
.tabs{display:flex;gap:4px;margin-top:10px;background:var(--off);padding:3px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--mute);font-weight:600}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
main{padding-top:14px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0 6px 0}
table{border-collapse:separate;border-spacing:3px}
th{font-weight:600;font-size:12px;color:var(--mute);text-align:center;padding:0 0 4px}
th small{display:block;font-weight:500;font-size:10px}
th.we{color:var(--ink)}
th.td{color:var(--acc);font-weight:800}
th.nm{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;min-width:124px;max-width:124px;padding:0 8px;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th.nm i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
td{padding:0}
.c{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--off);padding:0;display:block}
.c.on{background:var(--c);border-color:var(--c)}
.c:disabled{opacity:.35;cursor:default}
.stats{display:grid;gap:10px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 i{width:11px;height:11px;border-radius:4px}
.card h2 button{margin-left:auto;border:0;background:none;color:var(--mute);font-size:13px;padding:4px 6px;border-radius:6px}
.card h2 button.sure{color:#e03131;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.kv b{display:block;font-size:20px}
.kv span{font-size:12px;color:var(--mute)}
.add{margin-top:14px;display:grid;gap:10px}
.add input{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:9px;border:2px solid transparent;background:var(--c);padding:0}
.dot.on{border-color:var(--ink)}
.go{margin-left:auto;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
:root[data-theme="dark"] .go{color:#12151c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go{color:#12151c}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.yt{margin-bottom:8px;color:var(--mute)}
.yt b{font-size:26px;color:var(--ink);margin-right:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;padding:8px 10px;width:max-content}
.heat b{border-radius:3px;background:var(--off)}
.heat b.on{background:var(--c)}
.heat b.f{opacity:.35}
.heat b.e{background:none}
.empty{text-align:center;padding:22px 14px}
.empty p{margin:0 0 12px}
.empty button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:18px}
.c.rest{background:none;border-style:dashed}.c.slip{background:#e03131;border-color:#e03131}.c.on,.c.slip{color:#fff;font-size:11px;font-weight:700}
.hero{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}.hero b{font-size:19px}.hero p{margin:4px 0 0;color:var(--mute)}
.tiles{display:grid;gap:10px}.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:14px;transition:transform .12s,background .2s}.tile:active{transform:scale(.97)}.tile.on{background:color-mix(in srgb,var(--c) 14%,var(--card))}
.mk{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font-weight:800;color:#fff}.tile.on .mk{background:var(--c)}.tt{flex:1;min-width:0}.tt b{display:block}.tt small{display:block;color:var(--mute)}
.bar{display:block;height:6px;border-radius:3px;background:var(--off);margin-top:6px;overflow:hidden}.bar u{display:block;height:100%;background:var(--c);transition:width .25s}
select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}.row input{width:auto;flex:1;min-width:80px}
[hidden]{display:none!important}
.c.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px 6px 8px}.sw i{width:22px;height:22px;border-radius:6px;background:var(--c);border:1px solid var(--line)}
.pal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:420px}.sh{font-weight:700;margin-bottom:12px}
.pg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.pg button{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--c);padding:0}.pg button.on{outline:2px solid var(--ink);outline-offset:1px}
.wrap{padding-bottom:120px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px;padding:8px;border-radius:30px;background:color-mix(in srgb,var(--card) calc(var(--dock-a,82)*1%),transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.18)}
.dock .pill{position:absolute;top:8px;height:50px;border-radius:24px;background:var(--ink);pointer-events:none;z-index:0;transition:left .5s cubic-bezier(.34,1.45,.5,1),width .5s cubic-bezier(.34,1.45,.5,1)}
.dock button{position:relative;z-index:1;width:58px;height:50px;border:0;border-radius:24px;background:none;display:grid;place-items:center;color:var(--mute);transition:transform .25s cubic-bezier(.34,1.56,.64,1),color .3s}
.dock button:active{transform:scale(.84)}.dock button svg{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}.dock button.on{color:var(--bg)}.dock button.on svg{transform:scale(1.1)}
.dock svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile{position:relative;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.tile>*{position:relative}.tile .fill{position:absolute;inset:0 auto 0 0;width:calc(var(--f,0)*100%);background:color-mix(in srgb,var(--c) 38%,transparent);opacity:0;pointer-events:none}.tile.drag .fill{opacity:1}.tile.drag{transform:scale(1.02)}.tile:not(.on) .mk{color:var(--c)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal i{font-style:normal;text-align:center;font-size:12px;color:var(--mute)}
.cd{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:14px}.cd small{font-size:10px}.cd.f{opacity:.4}.cd.t{outline:2px solid var(--acc)}.cd.p{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.ringbox{display:grid;place-items:center;margin:18px 0 10px}.ringbox small{color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .card{text-align:center}.two b{display:block;font-size:26px}.two span{color:var(--mute);font-size:13px}
.soon{text-align:center;padding:48px 20px}.soon .em{font-size:44px}.soon h2{justify-content:center;margin:8px 0}.soon p{color:var(--mute);margin:0}
.set{display:grid;gap:10px}.set label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}.set input,.set select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.ac{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.ac.lock{opacity:.45}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:40;font-weight:600}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.pal2{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}.bgs{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);padding:0}.bgs.on{outline:2px solid var(--ink);outline-offset:2px}
.rst{background:var(--off);border:0;border-radius:10px;padding:10px;font-weight:600;color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:3px;flex:1;min-width:90px;font-size:12px;color:var(--mute)}.fld input{width:100%;flex:none;min-width:0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top"><h1>Habits</h1><button class="ib" id="th" aria-label="Сменить тему">◐</button></div>
  <div class="nav"><button class="ib" id="pv" aria-label="Назад">‹</button><div class="lbl" id="lb"></div><button class="ib" id="nx" aria-label="Вперёд">›</button></div>
  <div class="tabs"><button id="tt" class="on">Сегодня</button><button id="tm">Месяц</button><button id="ty">Год</button></div>
</header>
<main id="app"></main>
<div id="pal" class="pal" hidden><div class="sheet"><div class="sh">Выберите цвет</div><div class="pg" id="pg"></div></div></div>
<nav class="dock" id="dock" aria-label="Разделы"><i class="pill"></i><button data-pg="habits" class="on" aria-label="Привычки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg></button><button data-pg="cal" aria-label="Календарь"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button><button data-pg="food" aria-label="Питание"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 002 2v8M11 3v8a2 2 0 01-2 2M17 21V3c-2.5 1.5-3 5-3 8h3"/></svg></button><button data-pg="ana" aria-label="Аналитика"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></button><button data-pg="set" aria-label="Личное пространство"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.6-4 3.6-6.5 7.5-6.5s6.9 2.5 7.5 6.5"/></svg></button></nav>
<canvas id="fx"></canvas><div class="toast" id="toast" hidden></div>
<div class="wrap" style="padding:0" id="addbox">
  <div class="add">
    <input id="nm" maxlength="40" placeholder="Новая привычка, например «Спортзал»" aria-label="Название привычки">
    <div class="row"><select id="kind" aria-label="Тип"><option value="check">Галочка</option><option value="count">Число</option><option value="timer">Таймер</option><option value="quit">Бросить</option></select><select id="sch" aria-label="Расписание"><option value="daily">Каждый день</option><option value="days">По дням недели</option><option value="week">Раз в неделю</option></select></div>
<div class="row" id="cx" hidden><label class="fld">Цель в день<input id="goal" type="number" min="1" value="8"></label><label class="fld">За одно нажатие<input id="step" type="number" min="1" value="1"></label><label class="fld">Что считаем<input id="unit" maxlength="12" placeholder="стаканов, минут"></label></div>
<div class="row" id="dx" hidden></div>
<div class="row" id="cl"></div>
  </div>
  <p class="note">Данные хранятся на этом устройстве. Синхронизация между телефоном и компьютером появится в полной версии.</p>
</div>
</div>
<script>
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const COLORS=['#3b5bdb','#0ca678','#f08c00','#ae3ec9','#e03131','#1098ad','#2f9e44','#d6336c','#7048e8','#1971c2','#e8590c','#5c940d','#a61e4d','#0b7285','#862e9c','#495057','#99692e','#3d5a80','#12b886','#c9a227'];
const KEY='v-kletku-1';
let S={habits:[]},view='today',cur=new Date(),sel=null,pick=0;
const form={d:[0,1,2,3,4],n:3};
let page='habits';const TM={};
const GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
cur.setDate(1);
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const kd=d=>key(d.getFullYear(),d.getMonth(),d.getDate());
const today=new Date();today.setHours(0,0,0,0);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const due=(h,d)=>h.sch==='days'?h.wd.includes(wdi(d)):true;
const done=(h,d)=>{if(h.kind==='quit')return d>=new Date(h.start+'T00:00:00')&&d<=today&&!h.days[kd(d)];const v=h.days[kd(d)]||0;return h.kind==='count'||h.kind==='timer'?v>=h.goal:!!v};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const wdi=d=>(d.getDay()+6)%7;

function streaks(h){
  const ks=Object.keys(h.days).sort(),s0=h.kind==='quit'?new Date(h.start+'T00:00:00'):ks.length?new Date(ks[0]+'T00:00:00'):null;
  if(h.sch==='week'){
    const n=h.n||3,mon=d=>addD(d,-wdi(d)),cnt=w=>{let c=0;for(let i=0;i<7;i++){const x=addD(w,i);if(x<=today&&h.days[kd(x)])c++}return c};
    let w=mon(today),c=0,best=0,run=0;if(cnt(w)<n)w=addD(w,-7);
    while(cnt(w)>=n&&c<600){c++;w=addD(w,-7)}
    if(s0)for(let x=mon(s0);x<=today;x=addD(x,7)){if(cnt(x)>=n){run++;best=Math.max(best,run)}else if(x<mon(today))run=0}
    return{c,best,u:'нед.'};
  }
  const soft=h.kind!=='quit',pv=(x,s)=>{let p=addD(x,s),k=0;while(!due(h,p)&&k++<7)p=addD(p,s);return p};
  let d=new Date(today);if(due(h,d)&&!done(h,d))d=addD(d,-1);
  let c=0,g=0;
  while(g++<4000){
    if(!due(h,d)){d=addD(d,-1);continue}
    if(done(h,d))c++;else if(!(soft&&done(h,pv(d,-1))))break;
    d=addD(d,-1);
  }
  let best=0,run=0;
  if(s0)for(let x=s0;x<=today;x=addD(x,1)){
    if(!due(h,x))continue;
    if(done(h,x)){run++;best=Math.max(best,run)}
    else if(!(soft&&done(h,pv(x,-1))&&done(h,pv(x,1))))run=0;
  }
  return{c,best,u:'дн.'};
}
function bestWd(h){
  const a=[0,0,0,0,0,0,0];let n=0;
  for(const k in h.days){a[wdi(new Date(k+'T00:00:00'))]++;n++}
  return n<7?'—':WD[a.indexOf(Math.max(...a))];
}
function pct(h){
  const y=cur.getFullYear(),m=cur.getMonth(),dim=new Date(y,m+1,0).getDate();
  let last=dim;
  if(y===today.getFullYear()&&m===today.getMonth())last=today.getDate();
  else if(new Date(y,m,1)>today)return 0;
  let c=0,t=0;for(let d=1;d<=last;d++){const x=new Date(y,m,d);if(due(h,x)){t++;if(done(h,x))c++}}
  return t?Math.round(c/t*100):0;
}
function monthView(){
  const y=cur.getFullYear(),m=cur.getMonth(),dim=new Date(y,m+1,0).getDate();
  let h='<div class="scroll" id="sc"><table><thead><tr><th class="nm"></th>';
  for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),w=wdi(dt);
    h+=`<th class="${+dt===+today?'td':''}${w>4?' we':''}">${d}<small>${WD[w]}</small></th>`}
  h+='</tr></thead><tbody>';
  for(const b of S.habits){
    h+=`<tr><th class="nm"><i style="background:${b.color}"></i>${esc(b.name)}</th>`;
    for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),k=key(y,m,d),on=done(b,dt),v=b.days[k],q=b.kind==='quit',dis=dt>today||(q&&dt<new Date(b.start+'T00:00:00'));
      h+=`<td><button class="c${on?' on':''}${due(b,dt)?'':' rest'}${q&&v?' slip':''}" style="--c:${b.color}" data-h="${b.id}" data-k="${k}" aria-pressed="${on}" aria-label="${esc(b.name)}, ${pad(d)}.${pad(m+1)}"${dis?' disabled':''}>${b.kind==='count'&&v?v:''}${q&&v?'×':''}</button></td>`}
    h+='</tr>';
  }
  h+='</tbody></table></div><div class="stats">';
  for(const b of S.habits){const s=streaks(b);
    h+=`<div class="card"><h2><i style="background:${b.color}"></i>${esc(b.name)}<button data-del="${b.id}">Удалить</button></h2><div class="kv"><div><b>${s.c}</b><span>серия, ${s.u}</span></div><div><b>${s.best}</b><span>рекорд</span></div><div><b>${pct(b)}%</b><span>за месяц</span></div><div><b>${bestWd(b)}</b><span>лучший день</span></div></div></div>`}
  return h+'</div>';
}
function yearView(){

  change(b,today,()=>{if(f>=.85)b.days[k]=cnt?Math.max(b.goal,b.days[k]||0):1;else if(cnt&&f>.05)b.days[k]=Math.min(b.goal,Math.round(f*b.goal/st)*st)})});

$('dock').onclick=e=>{const b=e.target.closest('button');if(b){page=b.dataset.pg;scrollTo(0,0);render()}};
$('app').addEventListener('input',e=>{const p=e.target.dataset.p;if(p){S.prof=S.prof||{};S.prof[p]=e.target.value;save()}if(e.target.dataset.dock!==undefined){S.look=S.look||{};S.look.t=+e.target.value;$('dv').textContent=e.target.value;applyLook();save()}});
const GB=['#f5f6f1','#ffffff','#fdf2f2','#fff4e6','#fff9db','#ebfbee','#e6fcf5','#e7f5ff','#f3f0ff','#fff0f6','#2b2d42','#12151c'];
function dockT(){return S.look&&S.look.t!=null?S.look.t:18}
function hx(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function mix(a,b,p){const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*p).toString(16).padStart(2,'0')).join('')}
function applyLook(){
  const r=document.documentElement.style,bg=(S.look||{}).bg;
  if(!bg){['--bg','--ink','--mute','--card','--line','--grid','--off'].forEach(v=>r.removeProperty(v))}
  else{const[a,b,c]=hx(bg),lt=(0.299*a+0.587*b+0.114*c)/255>.55;
    r.setProperty('--bg',bg);
    r.setProperty('--ink',lt?'#1d2740':'#e7ebf5');
    r.setProperty('--mute',lt?'#667189':'#93a0ba');
    r.setProperty('--card',lt?mix(bg,'#ffffff',.55):mix(bg,'#ffffff',.08));
    r.setProperty('--line',lt?mix(bg,'#000000',.14):mix(bg,'#ffffff',.18));
    r.setProperty('--grid',lt?mix(bg,'#000000',.06):mix(bg,'#ffffff',.06));
    r.setProperty('--off',lt?mix(bg,'#000000',.07):mix(bg,'#ffffff',.1));
  }
  r.setProperty('--dock-a',String(100-dockT()));
}
applyLook();formUI();drawDots();render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
