.tw .tile{transition:transform .25s cubic-bezier(.34,1.3,.5,1),width .25s ease,background .2s}
.tw.ed .tile{width:calc(100% - 34px)}
.hnd{position:absolute;right:2px;top:50%;width:28px;height:40px;margin-top:-20px;display:grid;place-items:center;color:var(--mute);touch-action:none;cursor:grab;animation:hin .3s ease both}.hnd svg{width:20px;height:6px;fill:currentColor}
@keyframes hin{from{opacity:0}to{opacity:1}}
.tw.lift{position:relative;z-index:5}.tw.lift .tile{box-shadow:0 10px 26px rgba(0,0,0,.28);transform:scale(1.03)!important;animation:none}
*{-webkit-tap-highlight-color:transparent}html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,select,.dock,.tile,.chip,.tw,.mi,.seg,.cd{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}button:focus:not(:focus-visible){outline:none}
#kind,#sch,#tu{display:none!important}
.dd{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}.dd::after{content:"▾";margin-left:8px;opacity:.55;font-size:12px}
.gbd{position:fixed;inset:0;z-index:59}
.gpop{position:fixed;z-index:60;overflow:auto;padding:8px;border-radius:22px;background:color-mix(in srgb,var(--card) calc(max(40,var(--dock-a,82))*1%),transparent);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:0 14px 40px rgba(0,0,0,.28);animation:gin .2s cubic-bezier(.2,.9,.3,1.15) both;min-width:190px;max-width:calc(100vw - 20px);overscroll-behavior:contain}
@keyframes gin{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
.gl{display:grid;gap:2px}.gi{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;background:none;color:var(--ink);padding:11px 12px;border-radius:14px;font:inherit;text-align:left}.gi.on{background:color-mix(in srgb,var(--ink) 10%,transparent);font-weight:600}.gi:active{background:color-mix(in srgb,var(--ink) 16%,transparent)}
.gpop .pg{width:min(300px,calc(100vw - 36px))}.gpop .ig{width:min(330px,calc(100vw - 36px));max-height:none;overflow:visible}
.fld{display:flex;flex-direction:column;gap:3px;flex:1;min-width:90px;font-size:12px;color:var(--mute)}.fld input{width:100%;flex:none;min-width:0}
</style>

<body>
<div class="wrap">
<header>
  <div class="top"><h1>Habits</h1></div>
  <div class="nav"><button class="ib" id="pv" aria-label="Назад">‹</button><div class="lbl" id="lb"></div><button class="ib" id="nx" aria-label="Вперёд">›</button></div>
  <div class="tabs"><button id="tt" class="on">Сегодня</button><button id="tm">Месяц</button><button id="ty">Год</button></div>
</header>
<main id="app"></main>
<div id="pal" class="pal" hidden><div class="sheet"><div class="sh">Выберите цвет</div><div class="pg" id="pg"></div></div></div>
<div id="cfm" class="pal mid" hidden><div class="dlg"><p id="cfmt"></p><div class="dbtn"><button data-cfm="no" id="cfn"></button><button data-cfm="yes" id="cfy" class="danger"></button></div></div></div>
<div id="ipk" class="pal" hidden><div class="sheet"><div class="sh" id="ish"></div><div class="ig" id="ig"></div></div></div>
<nav class="dock" id="dock" aria-label="Разделы"><i class="pill"></i><button data-pg="habits" class="on" aria-label="Привычки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg></button><button data-pg="cal" aria-label="Календарь"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button><button data-pg="mood" aria-label="Настроение"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14c.8 1.2 2 2 3.5 2s2.7-.8 3.5-2M9 9.5h.01M15 9.5h.01"/></svg></button><button data-pg="food" aria-label="Питание"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 002 2v8M11 3v8a2 2 0 01-2 2M17 21V3c-2.5 1.5-3 5-3 8h3"/></svg></button><button data-pg="ana" aria-label="Аналитика"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></button><button data-pg="set" aria-label="Личное пространство"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.6-4 3.6-6.5 7.5-6.5s6.9 2.5 7.5 6.5"/></svg></button></nav>
<canvas id="fx"></canvas><div class="toast" id="toast" hidden></div>
<div class="wrap" style="padding:0" id="addbox">
  <div class="add">
    <input id="nm" maxlength="40" placeholder="Новая привычка, например «Спортзал»" aria-label="Название привычки">
    <div class="row"><button class="dd" id="ddk" data-ddf="kind" type="button"></button><button class="dd" id="dds" data-ddf="sch" type="button"></button><button class="dd" id="ddt" data-ddf="tu" type="button" hidden></button><select id="kind" aria-label="Тип"><option value="check">Галочка</option><option value="count">Число</option><option value="timer">Таймер</option><option value="quit">Бросить</option></select><select id="sch" aria-label="Расписание"><option value="daily">Каждый день</option><option value="days">По дням недели</option><option value="week">Раз в неделю</option></select></div>
<div class="row" id="cx" hidden><label class="fld">Цель в день<input id="goal" type="number" min="1" value="8"></label><label class="fld">За одно нажатие<input id="step" type="number" min="1" value="1"></label><label class="fld">Что считаем<input id="unit" maxlength="12" placeholder="стаканов, минут"></label></div>
<select id="tu" hidden><option value="min">Минуты</option><option value="sec">Секунды</option></select>
<div class="row" id="dx" hidden></div>
<div class="row" id="cl"></div>
  </div>
  <p class="note">Данные хранятся на этом устройстве. Синхронизация между телефоном и компьютером появится в полной версии.</p>
</div>
</div>
<script>
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const COLORS=['#3b5bdb','#0ca678','#f08c00','#ae3ec9','#e03131','#1098ad','#2f9e44','#d6336c','#7048e8','#1971c2','#e8590c','#5c940d','#a61e4d','#0b7285','#862e9c','#495057','#99692e','#3d5a80','#12b886','#c9a227'];
const KEY='v-kletku-1';
let S={habits:[]},view='today',cur=new Date(),sel=null,pick=0;
const form={d:[0,1,2,3,4],n:3};
let page='habits';const TM={};
const GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
cur.setDate(1);
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const kd=d=>key(d.getFullYear(),d.getMonth(),d.getDate());
const today=new Date();today.setHours(0,0,0,0);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const due=(h,d)=>h.sch==='days'?h.wd.includes(wdi(d)):true;
const done=(h,d)=>{if(h.kind==='quit')return d>=new Date(h.start+'T00:00:00')&&d<=today&&!h.days[kd(d)];const v=h.days[kd(d)]||0;return h.kind==='count'||h.kind==='timer'?v>=h.goal:!!v};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const wdi=d=>(d.getDay()+6)%7;

function streaks(h){
  const ks=Object.keys(h.days).sort(),s0=h.kind==='quit'?new Date(h.start+'T00:00:00'):ks.length?new Date(ks[0]+'T00:00:00'):null;
  if(h.sch==='week'){
    const n=h.n||3,mon=d=>addD(d,-wdi(d)),cnt=w=>{let c=0;for(let i=0;i<7;i++){const x=addD(w,i);if(x<=today&&h.days[kd(x)])c++}return c};
    let w=mon(today),c=0,best=0,run=0;if(cnt(w)<n)w=addD(w,-7);
    while(cnt(w)>=n&&c<600){c++;w=addD(w,-7)}
    if(s0)for(let x=mon(s0);x<=today;x=addD(x,7)){if(cnt(x)>=n){run++;best=Math.max(best,run)}else if(x<mon(today))run=0}
    return{c,best,u:'нед.'};
  }
  const soft=h.kind!=='quit',pv=(x,s)=>{let p=addD(x,s),k=0;while(!due(h,p)&&k++<7)p=addD(p,s);return p};
  let d=new Date(today);if(due(h,d)&&!done(h,d))d=addD(d,-1);
  let c=0,g=0;
  while(g++<4000){
    if(!due(h,d)){d=addD(d,-1);continue}
    if(done(h,d))c++;else if(!(soft&&done(h,pv(d,-1))))break;
    d=addD(d,-1);
  }
  let best=0,run=0;
  if(s0)for(let x=s0;x<=today;x=addD(x,1)){
    if(!due(h,x))continue;
    if(done(h,x)){run++;best=Math.max(best,run)}
    else if(!(soft&&done(h,pv(x,-1))&&done(h,pv(x,1))))run=0;
  }
  return{c,best,u:'дн.'};
}
function bestWd(h){
  const a=[0,0,0,0,0,0,0];let n=0;
  for(const k in h.days){a[wdi(new Date(k+'T00:00:00'))]++;n++}
  return n<7?'—':WD[a.indexOf(Math.max(...a))];
}
function pct(h){
  const y=cur.getFullYear(),m=cur.getMonth(),dim=new Date(y,m+1,0).getDate();
  let last=dim;
  if(y===today.getFullYear()&&m===today.getMonth())last=today.getDate();
  else if(new Date(y,m,1)>today)return 0;
  let c=0,t=0;for(let d=1;d<=last;d++){const x=new Date(y,m,d);if(due(h,x)){t++;if(done(h,x))c++}}
  return t?Math.round(c/t*100):0;
}
function monthView(){
  const y=cur.getFullYear(),m=cur.getMonth(),dim=new Date(y,m+1,0).getDate();
  let h='<div class="scroll" id="sc"><table><thead><tr><th class="nm"></th>';
  for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),w=wdi(dt);
    h+=`<th class="${+dt===+today?'td':''}${w>4?' we':''}">${d}<small>${WD[w]}</small></th>`}
  h+='</tr></thead><tbody>';
  for(const b of S.habits){
    h+=`<tr><th class="nm"><i style="background:${b.color}"></i>${esc(b.name)}</th>`;
    for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),k=key(y,m,d),on=done(b,dt),v=b.days[k],q=b.kind==='quit',dis=dt>today||(q&&dt<new Date(b.start+'T00:00:00'));
      h+=`<td><button class="c${on?' on':''}${due(b,dt)?'':' rest'}${q&&v?' slip':''}" style="--c:${b.color}" data-h="${b.id}" data-k="${k}" aria-pressed="${on}" aria-label="${esc(b.name)}, ${pad(d)}.${pad(m+1)}"${dis?' disabled':''}>${b.kind==='count'&&v?v:''}${q&&v?'×':''}</button></td>`}
    h+='</tr>';
  }
  h+='</tbody></table></div><div class="stats">';
  for(const b of S.habits){const s=streaks(b);
    h+=`<div class="card"><h2><i style="background:${b.color}"></i>${esc(b.name)}<button data-del="${b.id}">Удалить</button></h2><div class="kv"><div><b>${s.c}</b><span>серия, ${s.u}</span></div><div><b>${s.best}</b><span>рекорд</span></div><div><b>${pct(b)}%</b><span>за месяц</span></div><div><b>${bestWd(b)}</b><span>лучший день</span></div></div></div>`}
  return h+'</div>';
}
function yearView(){
  const y=cur.getFullYear(),b=S.habits.find(x=>x.id===sel)||S.habits[0];
  sel=b.id;
  const chips='<div class="chips">'+S.habits.map(x=>`<button class="chip${x.id===sel?' on':''}" data-s="${x.id}">${esc(x.name)}</button>`).join('')+'</div>';
  const off=wdi(new Date(y,0,1)),days=((y%4==0&&y%100!=0)||y%400==0)?366:365;
  let cells='',total=0;
  for(let i=0;i<off;i++)cells+='<b class="e"></b>';
  for(let i=0;i<days;i++){const dt=new Date(y,0,1+i),on=done(b,dt);if(on)total++;
    cells+=`<b class="${on?'on':''}${dt>today?' f':''}" style="--c:${b.color}" title="${kd(dt)}"></b>`}
  return chips+`<div class="card"><div class="yt"><b>${total}</b>дн. из года</div><div class="scroll" id="sc"><div class="heat">${cells}</div></div></div>`;
}
function render(){
  chrome();
  if(page!=='habits'){delMode=false;delSel=null;$('app').innerHTML=pageView();if(page==='mood')initMood();return}
  $('lb').textContent=view==='today'?WD[wdi(today)]+', '+today.getDate()+' '+GEN[today.getMonth()]:view==='month'?MONTHS[cur.getMonth()]+' '+cur.getFullYear():String(cur.getFullYear());
  $('pv').hidden=$('nx').hidden=view==='today';
  $('tt').classList.toggle('on',view==='today');$('tm').classList.toggle('on',view==='month');$('ty').classList.toggle('on',view==='year');
  const a=$('app');
  if(!S.habits.length){
    a.innerHTML='<div class="card empty"><p>Здесь пока пусто. Добавьте первую привычку внизу или посмотрите, как выглядит заполненная таблица.</p><button id="demo">Заполнить примером</button></div>';
    return;
  }
  a.innerHTML=view==='today'?todayView():view==='month'?monthView():yearView();
  const sc=$('sc');
  if(sc&&view==='month'&&cur.getMonth()===today.getMonth()&&cur.getFullYear()===today.getFullYear())sc.scrollLeft=Math.max(0,(today.getDate()-4)*34);
  if(sc&&view==='year'&&cur.getFullYear()===today.getFullYear())sc.scrollLeft=Math.max(0,(Math.floor((today-new Date(cur.getFullYear(),0,1))/864e5/7)-14)*16);
}
function demo(){
  const mk=(n,c,p)=>{const days={};for(let i=0;i<150;i++){const r=Math.sin(i*12.9898+n.length*78.233)*43758.5453;if(r-Math.floor(r)<p)days[kd(addD(today,-i))]=1}return{id:uid(),name:n,color:c,days}};
  const w={},q={};for(let i=0;i<60;i++){const r=Math.sin(i*5.1)*9999,v=Math.floor((r-Math.floor(r))*10);if(v>1)w[kd(addD(today,-i))]=Math.min(v,8)}
  q[kd(addD(today,-12))]=1;q[kd(addD(today,-26))]=1;
  const g=mk('Спортзал',COLORS[1],.5);g.sch='days';g.wd=[0,2,4];
  S.habits=[mk('Подъём в 7:00',COLORS[0],.7),g,{id:uid(),name:'Вода',color:COLORS[5],days:w,kind:'count',goal:8,step:1,unit:'стаканов'},{id:uid(),name:'Без сладкого',color:COLORS[2],days:q,kind:'quit',start:kd(addD(today,-40))}];
  save();render();
}
function addHabit(){
  const v=$('nm').value.trim();if(!v)return;
  const kind=$('kind').value,sch=kind==='quit'?'daily':$('sch').value,h={id:uid(),name:v,color:pc,days:{},kind,sch,created:kd(today),icon:pi};
  if(kind==='count'||kind==='timer'){h.goal=Math.max(1,+$('goal').value||1);h.step=Math.max(1,+$('step').value||1);h.unit=$('unit').value.trim()}
  if(kind==='timer')h.unit='мин';
  if(kind==='quit')h.start=kd(today);
  if(sch==='days')h.wd=form.d.length?form.d.slice():[0,1,2,3,4,5,6];
  if(sch==='week')h.n=form.n;
  S.habits.push(h);
  $('nm').value='';pi=null;pc=COLORS.find(c=>!S.habits.some(h=>h.color===c))||COLORS[0];drawDots();save();render();
}
function drawDots(){
  $('cl').innerHTML=`<button class="sw" id="sw" style="--c:${pc}" aria-label="Выбрать цвет"><i></i>Цвет</button><button class="go" id="go">Добавить</button>`;
}
$('app').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.mslot){mSlot=t.dataset.mslot;document.querySelectorAll('[data-mslot]').forEach(b=>b.classList.toggle('on',b===t));const em=(S.mood||{})[kd(today)]||{};mTar=em[mSlot]!=null?em[mSlot]:3;loop();return}
  if(t.hasAttribute('data-export')){exportX();return}
  if(t.dataset.dd){const dt=new Date(detDate+'T00:00:00');dt.setDate(dt.getDate()+(+t.dataset.dd));if(dt<=today){detDate=kd(dt);render()}return}
  if(t.dataset.dtab){detTab=t.dataset.dtab;render();return}
  if(t.hasAttribute('data-dback')){page='habits';render();return}
  if(t.dataset.dedit){editId=t.dataset.dedit;page='edit';render();return}
  if(t.dataset.adj){adj(S.habits.find(x=>x.id===detId),t.dataset.adj);return}
  if(t.dataset.h&&delMode&&view==='today'){delSel=delSel===t.dataset.h?null:t.dataset.h;render();return}
  if(t.dataset.h&&view==='today'&&!editMode&&e.target.closest('.tt')){detId=t.dataset.h;detDate=kd(today);detTab='memo';page='det';render();return}
  if(t.dataset.h&&editMode&&view==='today'){if(Date.now()-sw<400)return;editId=t.dataset.h;page='edit';render();return}
  if(t.hasAttribute('data-edtoggle')){editMode=!editMode;if(editMode){delMode=false;delSel=null}render();if(editMode){document.querySelectorAll('.tw.ed').forEach(x=>x.classList.remove('ed'));requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.tw').forEach(x=>x.classList.add('ed'))))}return}
  if(t.hasAttribute('data-deltoggle')){delMode=!delMode;delSel=null;if(delMode)editMode=false;render();return}
  if(t.dataset.xdel){askDel(t.dataset.xdel);return}
  if(t.hasAttribute('data-ed-back')){page='habits';editId=null;render();return}
  if(t.dataset.hcol){const b=S.habits.find(x=>x.id===t.dataset.hcol);if(b){b.color=t.dataset.c;save();render()}return}
  if(t.dataset.hic!==undefined){const b=S.habits.find(x=>x.id===t.dataset.hic);if(b){b.icon=t.dataset.k||null;save();render()}return}
  if(t.dataset.hdel){if(t.dataset.arm){S.habits=S.habits.filter(x=>x.id!==t.dataset.hdel);save();editId=null;page='habits';render()}else{t.dataset.arm='1';t.textContent=TE[lang()].sure}return}
  if(t.dataset.h){if(Date.now()-sw<400)return;const b=S.habits.find(x=>x.id===t.dataset.h);
    if(b.kind==='timer'&&t.classList.contains('tile')){TM[b.id]?stopT(b):TM[b.id]=Date.now();render();return}
    const sc=$('sc'),sl=sc?sc.scrollLeft:0;change(b,new Date(t.dataset.k+'T00:00:00'),()=>bump(b,t.dataset.k));if($('sc'))$('sc').scrollLeft=sl}
  else if(t.dataset.s){sel=t.dataset.s;render()}
  else if(t.dataset.del){
    if(t.classList.contains('sure')){S.habits=S.habits.filter(x=>x.id!==t.dataset.del);save();render()}
    else{t.classList.add('sure');t.textContent='Точно удалить?';setTimeout(()=>{t.classList.remove('sure');t.textContent='Удалить'},3000)}
  }
  else if(t.dataset.sub){sub=t.dataset.sub;subS=null;render()}
  else if(t.dataset.subs){subS=t.dataset.subs;render()}
  else if(t.hasAttribute('data-back')){if(subS)subS=null;else sub=null;render()}
  else if(t.dataset.bg){S.look=S.look||{};S.look.bg=t.dataset.bg;applyLook();save();render()}
  else if(t.hasAttribute('data-reset')){S.look={};applyLook();save();render()}
  else if(t.id==='demo')demo();
});
$('cl').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='go')addHabit();else if(t.id==='sw')openPal()
});
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')addHabit()});
const step=n=>{if(view==='month'||page==='cal')cur.setMonth(cur.getMonth()+n);else cur.setFullYear(cur.getFullYear()+n);render()};

  if(md.e!=null)parts.push(`<span><i style="background:${MOODS[md.e].c}"></i>${isEn?'Evening':'Вечер'}: ${moodName(md.e)}</span>`);
  const info=`<div class="dayinfo">${parts.length?parts.join(''):`<span>${isEn?'no mood logged':'настроение не отмечено'}</span>`}</div>`;
  openPop(anchor,`<div style="width:min(300px,calc(100vw - 60px))">${info}<textarea data-dnote="${dk}" placeholder="${isEn?'Note for the day':'Заметка на день'}">${esc(dn)}</textarea></div>`,()=>{});
}
$('app').addEventListener('click',e=>{const c=e.target.closest('[data-md]');if(c&&page==='mood')openDay(c,c.dataset.md)});
$('app').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.mnav!==undefined){cur.setMonth(cur.getMonth()+(+t.dataset.mnav));render()}
  else if(t.dataset.ynav!==undefined){cur.setFullYear(cur.getFullYear()+(+t.dataset.ynav));render()}
  else if(t.dataset.amode){anaMode=t.dataset.amode;render()}
});
document.addEventListener('input',e=>{
  const d=e.target.dataset;if(d.dnote===undefined)return;
  S.dnotes=S.dnotes||{};const v=e.target.value;
  if(v.trim())S.dnotes[d.dnote]=v;else delete S.dnotes[d.dnote];
  save();
});
function pageView(){
  const T=TX[lang()];
  if(page==='edit')return editView();
  if(page==='det')return detView();
  if(page==='mood')return moodView();
  if(page==='ana')return analysisView();
  return setView();
}
applyLang();applyLook();formUI();drawDots();render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
